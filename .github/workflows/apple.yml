name: Apple

on:
  push:
    branches: [ main, preview-26.10.9, 'Jal/**' ]
  pull_request:

jobs:
  native-and-packages:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
      - name: Cache pinned Apple shader compiler slices
        uses: actions/cache@v4
        with:
          path: src/native/out/apple-deps
          key: apple-shader-toolchain-${{ runner.os }}-xcode-26.6-${{ hashFiles('eng/apple/dependencies.lock.json', 'eng/apple/prepare-shader-toolchain.sh') }}
      - name: Install pinned Apple workloads
        run: dotnet workload install ios tvos macos --version 10.0.300.2
      - name: Build Apple native slices
        run: |
          bash eng/apple/build-native.sh macos Release
          bash eng/apple/build-native.sh ios Release
          bash eng/apple/build-native.sh iossimulator Release
          bash eng/apple/build-native.sh tvos Release
          bash eng/apple/build-native.sh tvossimulator Release
          bash eng/apple/build-native.sh visionos Release
          bash eng/apple/build-native.sh visionsimulator Release
      - name: Assemble static XCFramework
        run: bash eng/apple/package-xcframework.sh Release
      - name: Build Apple entry packages
        run: |
          dotnet build src/packaging/Jalium.UI.MacOS/Jalium.UI.MacOS.csproj -c Release -p:JaliumPlatform=macos
          dotnet build src/packaging/Jalium.UI.iOS/Jalium.UI.iOS.csproj -c Release -f net10.0-ios -p:JaliumPlatform=ios
          dotnet build src/packaging/Jalium.UI.tvOS/Jalium.UI.tvOS.csproj -c Release -f net10.0-tvos -p:JaliumPlatform=tvos
      - name: Upload Apple native artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaliumNative-Apple
          path: src/native/artifacts/apple/JaliumNative.xcframework

  image-orientation:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure focused image tests
        run: >-
          cmake -S src/native -B /tmp/jalium-image-tests
          -DCMAKE_BUILD_TYPE=Release -DJALIUM_METAL_BUILD_TESTS=ON
          -DJALIUM_METAL_REQUIRE_RUNTIME_SHADER_COMPILER=OFF
      - name: Build focused image tests
        run: cmake --build /tmp/jalium-image-tests --target jalium.native.metal.image-orientation --parallel 4
      - name: Verify CPU pixel order independently of GPU readback
        run: ctest --test-dir /tmp/jalium-image-tests -R '^jalium.native.metal.image-pixels$' --output-on-failure -V
      - name: Compare actual Metal rendering against software
        if: ${{ !cancelled() }}
        run: ctest --test-dir /tmp/jalium-image-tests -R '^jalium.native.metal.image-render$' --output-on-failure -V
