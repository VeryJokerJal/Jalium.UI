name: Apple

on:
  push:
    branches: [ main, preview-26.10.9, 'Jal/**' ]
  pull_request:

jobs:
  media-availability:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Build and verify macOS media behavior
        run: |
          cmake -S src/native -B "$RUNNER_TEMP/jalium-media-macos" \
            -DCMAKE_BUILD_TYPE=Release -DJALIUM_MEDIA_APPLE_BUILD_TESTS=ON \
            -DJALIUM_METAL_REQUIRE_RUNTIME_SHADER_COMPILER=OFF
          cmake --build "$RUNNER_TEMP/jalium-media-macos" --parallel 4 \
            --target jalium.native.media.apple.tests
          ctest --test-dir "$RUNNER_TEMP/jalium-media-macos" \
            -R '^jalium[.]native[.]media[.]apple[.]availability$' --output-on-failure -V
      - name: Compile Apple media device and simulator archives
        run: |
          for slice in ios iossimulator tvos tvossimulator visionos visionossimulator; do
            cmake --preset "apple-$slice-arm64" -S src/native \
              -B "$RUNNER_TEMP/jalium-media-$slice" \
              -DJALIUM_METAL_REQUIRE_RUNTIME_SHADER_COMPILER=OFF \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
            cmake --build "$RUNNER_TEMP/jalium-media-$slice" --config Release \
              --target jalium.native.media.apple --parallel 4
          done

  native-and-packages:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
      - name: Verify generated template lifetimes
        run: >-
          dotnet test tests/Jalium.UI.Template.Tests/Jalium.UI.Template.Tests.csproj
          -c Release --nologo --disable-build-servers
          -p:UseSharedCompilation=false -m:1 --logger trx
      - name: Cache pinned Apple shader compiler slices
        uses: actions/cache@v4
        with:
          path: src/native/out/apple-deps
          key: apple-shader-toolchain-${{ runner.os }}-xcode-26.6-${{ hashFiles('eng/apple/dependencies.lock.json', 'eng/apple/prepare-shader-toolchain.sh', 'eng/apple/patch-shader-toolchain.py') }}
      - name: Install pinned Apple workloads
        run: dotnet workload install ios tvos macos --version 10.0.300.2
      - name: Build Apple native slices
        run: |
          bash eng/apple/build-native.sh macos Release
          bash eng/apple/build-native.sh ios Release
          bash eng/apple/build-native.sh iossimulator Release
          bash eng/apple/build-native.sh tvos Release
          bash eng/apple/build-native.sh tvossimulator Release
          bash eng/apple/build-native.sh visionos Release
          bash eng/apple/build-native.sh visionsimulator Release
      - name: Assemble static XCFramework
        run: bash eng/apple/package-xcframework.sh Release
      - name: Build Apple entry packages
        run: |
          dotnet build src/packaging/Jalium.UI.MacOS/Jalium.UI.MacOS.csproj -c Release -p:JaliumPlatform=macos
          dotnet build src/packaging/Jalium.UI.iOS/Jalium.UI.iOS.csproj -c Release -f net10.0-ios -p:JaliumPlatform=ios
          dotnet build src/packaging/Jalium.UI.tvOS/Jalium.UI.tvOS.csproj -c Release -f net10.0-tvos -p:JaliumPlatform=tvos
      - name: Upload Apple native artifact
        uses: actions/upload-artifact@v4
        with:
          name: JaliumNative-Apple
          path: src/native/artifacts/apple/JaliumNative.xcframework

  image-orientation:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure focused image tests
        run: >-
          cmake -S src/native -B /tmp/jalium-image-tests
          -DCMAKE_BUILD_TYPE=Release -DJALIUM_METAL_BUILD_TESTS=ON
          -DJALIUM_METAL_REQUIRE_RUNTIME_SHADER_COMPILER=OFF
      - name: Build focused image tests
        id: image-build
        run: cmake --build /tmp/jalium-image-tests --target jalium.native.metal.image-orientation --parallel 4
      - name: Verify CPU pixel order independently of GPU readback
        run: ctest --test-dir /tmp/jalium-image-tests -R '^jalium.native.metal.image-pixels$' --output-on-failure -V
      - name: Compare actual Metal rendering against software
        if: ${{ !cancelled() && steps.image-build.outcome == 'success' }}
        run: ctest --test-dir /tmp/jalium-image-tests -R '^jalium.native.metal.image-render$' --output-on-failure -V

  window-contracts:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Configure Window contracts without shader compiler dependencies
        run: >-
          cmake -S src/native -B "$RUNNER_TEMP/jalium-window-contracts"
          -DCMAKE_BUILD_TYPE=Release -DJALIUM_PLATFORM_BUILD_TESTS=ON
          -DJALIUM_METAL_REQUIRE_RUNTIME_SHADER_COMPILER=OFF
          -DJALIUM_NATIVE_OUTPUT_ROOT="$RUNNER_TEMP/jalium-window-native"
      - name: Build Window, clipboard and thread-affinity contract fixtures
        run: >-
          cmake --build "$RUNNER_TEMP/jalium-window-contracts" --parallel 4 --target
          jalium.native.platform.clipboard.tests
          jalium.native.platform.thread-affinity.tests
          jalium.native.platform.window.tests
          jalium.native.platform.window.accessibility.tests
          jalium.native.platform.window.popup-keyboard.tests
          jalium.native.platform.window.keyboard-focus.tests
          jalium.native.platform.window.owner.tests
          jalium.native.platform.window.resize.tests
          jalium.native.platform.window.menu.tests
          jalium.native.platform.window.startup.tests
          jalium.native.platform.window.drag.tests
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
      - name: Verify managed popup ownership and binding reentrancy
        run: |
          dotnet test tests/Jalium.UI.MacOS.Tests/Jalium.UI.MacOS.Tests.csproj -c Debug \
            -p:JaliumBuildRoot="$RUNNER_TEMP/jalium-popup-owner-managed" \
            -p:JaliumMacNativeGeometryTests=false \
            --filter FullyQualifiedName~MacOSPopupOwnershipTests \
            --logger 'trx;LogFileName=popup-ownership.trx' \
            --results-directory "$RUNNER_TEMP/jalium-popup-owner-results"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path(os.environ['RUNNER_TEMP']) / 'jalium-popup-owner-results/popup-ownership.trx'
          counts = ET.parse(path).find('.//{*}Counters').attrib
          assert all(int(counts[name]) == 29 for name in ['total', 'executed', 'passed']), counts
          assert all(int(counts[name]) == 0 for name in ['failed', 'error', 'timeout', 'notExecuted']), counts
          print('All 29 managed popup ownership contracts executed and passed.')
          PY
      - name: Verify all Window, clipboard and thread-affinity contracts
        run: >-
          ctest --test-dir "$RUNNER_TEMP/jalium-window-contracts"
          -R '^jalium[.]native[.]platform[.](clipboard|macos[.](window|thread-affinity)([.].*)?)$'
          --output-on-failure -V

  metal-readback:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      JALIUM_METAL_DIAGNOSTICS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Configure focused readback and regression tests
        run: >-
          cmake -S src/native -B /tmp/jalium-readback-tests
          -DCMAKE_BUILD_TYPE=Release -DJALIUM_METAL_BUILD_TESTS=ON -DJALIUM_SOFTWARE_BUILD_TESTS=ON
          -DJALIUM_METAL_REQUIRE_RUNTIME_SHADER_COMPILER=OFF
      - name: Build focused readback and regression tests
        run: cmake --build /tmp/jalium-readback-tests --target jalium.native.metal.readback jalium.native.metal.regression jalium.native.metal.text-glyph-ranges jalium.native.metal.text-metrics jalium.native.metal.fonts jalium.native.software.apple.text jalium.native.platform --parallel 4
      - name: Verify GPU resources, readback and Window rendering regressions
        run: ctest --test-dir /tmp/jalium-readback-tests -R '^jalium[.]native[.](metal[.](gpu-.*baseline|readback(-no-resize)?|regression|text-glyph-ranges|text-metrics|fonts)|software[.]apple[.](text-glyph-ranges|coretext))$' --output-on-failure -V
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
      - name: Verify CoreText family resolution and private fallback lifetimes
        env:
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/src/native/bin/native/osx-arm64/Release
        run: |
          dotnet test tests/Jalium.UI.MacOS.Tests/Jalium.UI.MacOS.Tests.csproj -c Debug \
            -p:JaliumBuildRoot="$RUNNER_TEMP/jalium-coretext-managed" \
            -p:JaliumMacNativeGeometryTests=true \
            --filter 'FullyQualifiedName~MacOSFontResolutionTests|FullyQualifiedName~MacOSFontCascadeTests|FullyQualifiedName~MacOSTextBoxAlignmentTests|FullyQualifiedName~MacOSTextStyleRangeSnapshotTests|FullyQualifiedName~WritingToolsInlinePreservationTests' \
            --logger 'trx;LogFileName=font-resolution.trx' \
            --results-directory "$RUNNER_TEMP/jalium-font-results"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          counts = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'jalium-font-results/font-resolution.trx').find('.//{*}Counters').attrib
          assert all(int(counts[name]) == 131 for name in ['total', 'executed', 'passed']), counts
          assert all(int(counts[name]) == 0 for name in ['failed', 'error', 'timeout', 'notExecuted']), counts
          print('All 131 CoreText font, ranged style snapshot and semantic inline contracts executed and passed.')
          PY
