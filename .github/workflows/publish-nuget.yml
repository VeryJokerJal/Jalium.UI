name: Publish qualified NuGet packages

on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful package qualification run
        type: string
        required: true
        default: '43711107625'
      version:
        description: Qualified stable package version
        type: string
        required: true
        default: '26.11.1'
      source_commit:
        description: Exact source revision of the qualified packages
        type: string
        required: true
        default: '76855d6ff8f55985411a8e7be5956612ccea9a46'
      symbols_only:
        description: Retry only companion symbol packages
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: nuget-publish-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: nuget
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_SOURCE: ${{ inputs.source_commit }}
      QUALIFICATION_RUN: ${{ inputs.qualification_run }}
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: 10.0.300
      - name: Check qualification provenance
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 eng/release/publish-qualified-nuget.py check "$RELEASE_REPOSITORY" "$QUALIFICATION_RUN" "$RELEASE_VERSION" "$RELEASE_SOURCE"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          path: qualified-source
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.qualified.outputs.artifact_name }}
          run-id: ${{ inputs.qualification_run }}
          github-token: ${{ github.token }}
          path: packages
      - name: Verify exact qualified package closure
        run: |
          cp packages/nuget-release-manifest.json "$RUNNER_TEMP/ci-release-manifest.json"
          python3 qualified-source/eng/release/verify-nuget.py packages "$RELEASE_VERSION" "$RELEASE_SOURCE"
          python3 eng/release/publish-qualified-nuget.py verify packages "$RELEASE_VERSION" "$RELEASE_SOURCE" "$RUNNER_TEMP/ci-release-manifest.json"
      - name: Exchange GitHub OIDC identity for a short-lived NuGet key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: SupperJal
      - name: Publish qualified packages and symbols
        env:
          NUGET_TEMP_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          SYMBOLS_ONLY: ${{ inputs.symbols_only }}
        run: |
          if [ "$SYMBOLS_ONLY" = 'true' ]; then
            python3 eng/release/publish-qualified-nuget.py push packages --symbols-only
          else
            python3 eng/release/publish-qualified-nuget.py push packages
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuget-publish-receipt-${{ inputs.version }}
          path: |
            packages/nuget-release-manifest.json
            packages/nuget-symbol-manifest.json
            packages/nuget-publish-results.json
          if-no-files-found: ignore
