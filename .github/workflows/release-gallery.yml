name: Release Gallery 26.11.1

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Build all platforms, or retry one platform
        type: choice
        options: [all, linux, macos, windows, android]
        default: all
      framework_ref:
        description: Optional exact framework revision to rebuild
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: gallery-release-26.11.1-${{ inputs.platform }}
  cancel-in-progress: false

env:
  FRAMEWORK_COMMIT: ${{ inputs.framework_ref || '76855d6ff8f55985411a8e7be5956612ccea9a46' }}
  GALLERY_COMMIT: aab8949b49d0adfff198b8400e906fc180898c8a
  NATIVE_SOURCE_RUN: 43701960384
  JALIUM_FRAMEWORK_ROOT: ${{ github.workspace }}/Jalium.UI
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  verify-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FRAMEWORK_COMMIT }}
          fetch-depth: 0
      - name: Verify native source inputs and qualified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 eng/release/check-native-artifacts.py "$GITHUB_REPOSITORY" "$NATIVE_SOURCE_RUN" "$FRAMEWORK_COMMIT"

  linux:
    needs: verify-native
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          path: Jalium.UI
          ref: ${{ env.FRAMEWORK_COMMIT }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: VeryJokerJal/Jalium-UI-Gallery
          ref: ${{ env.GALLERY_COMMIT }}
          path: Jalium.UI.Gallery
      - uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          run-id: ${{ env.NATIVE_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: Jalium.UI/src/native/bin/native/linux-x64/Release
      - name: Build Ubuntu 20.04 release image
        working-directory: Jalium.UI
        run: >-
          docker build --build-arg JALIUM_INSTALL_DOTNET=1
          --build-arg JALIUM_DOTNET_SDK_VERSION=10.0.300
          -t jalium-gallery-release:26.11.1 -f eng/linux/ubuntu20.04-glibc.Dockerfile .
      - name: Build and validate Linux x64 Gallery
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work/Jalium.UI \
            -e JALIUM_GALLERY_ROOT=/work/Jalium.UI.Gallery \
            -e JALIUM_FRAMEWORK_ROOT=/work/Jalium.UI -e JALIUM_RELEASE_NATIVE_READY=1 \
            -e JALIUM_RELEASE_ROOT=/work/artifacts/gallery-26.11.1 \
            jalium-gallery-release:26.11.1 \
            bash -c '
              set -euo pipefail
              # Ubuntu 20.04 Git ignores safe.directory supplied with -c.
              # Trust only these two checkouts inside this disposable container.
              git config --global --add safe.directory /work/Jalium.UI
              git config --global --add safe.directory /work/Jalium.UI.Gallery
              git -C /work/Jalium.UI rev-parse HEAD
              git -C /work/Jalium.UI.Gallery rev-parse HEAD
              bash /work/automation/eng/release/build-gallery.sh linux
            '
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-linux
          path: artifacts/gallery-26.11.1/assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-linux-test-results
          path: artifacts/gallery-26.11.1/test-results/*

  macos:
    needs: verify-native
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          path: Jalium.UI
          ref: ${{ env.FRAMEWORK_COMMIT }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: VeryJokerJal/Jalium-UI-Gallery
          ref: ${{ env.GALLERY_COMMIT }}
          path: Jalium.UI.Gallery
      - name: Read pinned Apple tools
        id: tools
        run: |
          python3 - <<'PYTOOLS'
          import json,os
          tools=json.load(open('Jalium.UI/eng/apple/toolchain.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for name in ['dotnetSdk','workloadSet','xcode']: print(f'{name}={tools[name]}',file=out)
          PYTOOLS
      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          dotnet-version: ${{ steps.tools.outputs.dotnetSdk }}
      - name: Select pinned Xcode and workload
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ steps.tools.outputs.xcode }}.app/Contents/Developer
          dotnet workload install macos --version '${{ steps.tools.outputs.workloadSet }}'
      - uses: actions/download-artifact@v4
        with:
          name: native-osx-arm64
          run-id: ${{ env.NATIVE_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: Jalium.UI/src/native/bin/native/osx-arm64/Release
      - name: Build and validate macOS arm64 Gallery
        env:
          JALIUM_RELEASE_ROOT: ${{ github.workspace }}/artifacts/gallery-26.11.1
          JALIUM_RELEASE_NATIVE_READY: '1'
        run: bash automation/eng/release/build-gallery.sh macos
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-macos
          path: artifacts/gallery-26.11.1/assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gallery-macos-test-results
          path: artifacts/gallery-26.11.1/test-results/*

  windows:
    needs: verify-native
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          path: Jalium.UI
          ref: ${{ env.FRAMEWORK_COMMIT }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: VeryJokerJal/Jalium-UI-Gallery
          ref: ${{ env.GALLERY_COMMIT }}
          path: Jalium.UI.Gallery
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
      - uses: microsoft/setup-msbuild@v2
      - name: Install pinned Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'vulkansdk.exe'
          Invoke-WebRequest 'https://sdk.lunarg.com/sdk/download/1.4.341.1/windows/vulkansdk-windows-X64-1.4.341.1.exe' -OutFile $installer
          $process = Start-Process $installer -ArgumentList '--root C:\VulkanSDK\1.4.341.1 --accept-licenses --default-answer --confirm-command install' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK install failed: $($process.ExitCode)" }
          'VULKAN_SDK=C:\VulkanSDK\1.4.341.1' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/download-artifact@v4
        with:
          name: native-windows
          run-id: ${{ env.NATIVE_SOURCE_RUN }}
          github-token: ${{ github.token }}
          path: Jalium.UI/src/native/bin
      - name: Bootstrap source build tools
        shell: bash
        env:
          JALIUM_RELEASE_BUILD_ROOT: ${{ github.workspace }}/artifacts/gallery-26.11.1/build/windows
        run: bash automation/eng/release/bootstrap-tools.sh
      - name: Publish and smoke-test Windows Gallery
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts/gallery-26.11.1'
          $published = Join-Path $root 'publish/win-x64'
          dotnet publish Jalium.UI.Gallery/Jalium.UI.Gallery.Desktop/Jalium.UI.Gallery.Desktop.csproj -c Release -r win-x64 -m:1 -p:JaliumBuildRoot="$root/build/windows/app" -p:RestoreConfigFile="$env:GITHUB_WORKSPACE/Jalium.UI/nuget.config" -p:GeneratePackageOnBuild=false -p:BuildJaliumNativeProjects=false -p:BuildJaliumNativeStaticProjects=false -o $published
          if ($LASTEXITCODE -ne 0) { throw 'Windows publish failed' }
          $started = Get-Date
          $stdout = Join-Path $root 'windows.stdout.log'
          $stderr = Join-Path $root 'windows.stderr.log'
          $app = Start-Process (Join-Path $published 'Jalium.UI.Gallery.Desktop.exe') -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              $app.Refresh()
              if ($app.HasExited) { throw "Gallery exited during startup: $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne 0) { break }
            }
            if ($app.MainWindowHandle -eq 0) { throw 'Gallery did not create a window' }
            if (-not $app.Responding) { throw 'Gallery window is not responding' }
            $app.CloseMainWindow() | Out-Null
            if (-not $app.WaitForExit(15000)) { throw 'Gallery did not close normally' }
            if ($app.ExitCode -ne 0) { throw "Gallery exit code: $($app.ExitCode)" }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=$started} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in @('.NET Runtime', 'Application Error', 'Windows Error Reporting') } |
              Format-List TimeCreated, ProviderName, Id, Message
          }
          python automation/eng/release/package-gallery.py windows --rid win-x64 --publish $published --output "$root/assets" --framework-root Jalium.UI --gallery-root Jalium.UI.Gallery
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-windows
          path: artifacts/gallery-26.11.1/assets/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gallery-windows-diagnostics
          path: |
            artifacts/gallery-26.11.1/*.log
            artifacts/gallery-26.11.1/publish/win-x64/*
          if-no-files-found: warn

  android:
    needs: verify-native
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: automation
      - uses: actions/checkout@v4
        with:
          path: Jalium.UI
          ref: ${{ env.FRAMEWORK_COMMIT }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: VeryJokerJal/Jalium-UI-Gallery
          ref: ${{ env.GALLERY_COMMIT }}
          path: Jalium.UI.Gallery
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android workload and pinned NDK
        shell: pwsh
        run: |
          dotnet workload install android --version 10.0.300.2
          if ($LASTEXITCODE -ne 0) { throw 'Android workload installation failed' }
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $sdkmanager 'ndk;27.2.12479018' 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android dependencies installation failed' }
      - name: Build both Android native ABIs
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="$(cygpath -u "$ANDROID_HOME")"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          bash Jalium.UI/src/native/build-android.sh all
      - name: Bootstrap source build tools
        shell: bash
        env:
          JALIUM_RELEASE_BUILD_ROOT: ${{ github.workspace }}/artifacts/gallery-26.11.1/build/android
        run: bash automation/eng/release/bootstrap-tools.sh
      - name: Publish and verify signed APKs
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'artifacts/gallery-26.11.1'
          $apksigner = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/apksigner.bat'
          $zipalign = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/zipalign.exe'
          foreach ($rid in @('android-arm64', 'android-x64')) {
            $published = Join-Path $root "publish/$rid"
            dotnet publish Jalium.UI.Gallery/Jalium.UI.Gallery.Android/Jalium.UI.Gallery.Android.csproj -c Release -r $rid -m:1 -p:JaliumBuildRoot="$root/build/$rid" -p:RestoreConfigFile="$env:GITHUB_WORKSPACE/Jalium.UI/nuget.config" -p:AndroidSdkDirectory="$env:ANDROID_HOME" -p:JavaSdkDirectory="$env:JAVA_HOME" -p:AndroidPackageFormats=apk -p:AndroidKeyStore=false -p:GeneratePackageOnBuild=false -p:BuildJaliumNativeProjects=false -p:BuildJaliumNativeStaticProjects=false -o $published
            if ($LASTEXITCODE -ne 0) { throw "Android publish failed: $rid" }
            $apks = @(Get-ChildItem $published -Filter '*-Signed.apk')
            if ($apks.Count -ne 1) { throw "Expected one signed APK for $rid, found $($apks.Count)" }
            & $apksigner verify --verbose $apks[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "APK signature validation failed: $rid" }
            & $zipalign -c -P 16 -v 4 $apks[0].FullName
            if ($LASTEXITCODE -ne 0) { throw "APK alignment validation failed: $rid" }
            python automation/eng/release/package-gallery.py android --rid $rid --publish $apks[0].FullName --output "$root/assets" --framework-root Jalium.UI --gallery-root Jalium.UI.Gallery
            if ($LASTEXITCODE -ne 0) { throw "APK packaging failed: $rid" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: gallery-android
          path: artifacts/gallery-26.11.1/assets/*
          if-no-files-found: error
